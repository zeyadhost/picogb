<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PicoGB Loader</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.5 system-ui, sans-serif; }
  body { max-width: 1000px; margin: 0 auto; padding: 12px 20px; }
  header { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid #8886; }
  h1 { margin: 0; font-size: 1.2rem; }
  h2 { margin: 20px 0 6px; font-size: 1rem; }
  h2:first-child { margin-top: 0; }
  #status { flex: 1; }
  .dim { color: GrayText; }
  .err { color: #d33; }
  main { display: flex; flex-wrap: wrap; gap: 28px; margin-top: 18px; }
  main > section { flex: 1; min-width: 300px; }
  main > div { width: 480px; max-width: 100%; }
  canvas { display: block; width: 100%; aspect-ratio: 10 / 9; background: #000; image-rendering: pixelated; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 5px 0; border-bottom: 1px solid #8884; }
  td + td { padding-left: 12px; }
  .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tr.playing td:first-child { font-weight: 600; }
  #drop { display: block; padding: 18px; border: 1px dashed GrayText; text-align: center; cursor: pointer; }
  #drop.over { border-style: solid; }
  progress { width: 100%; }
  kbd { font: .85em ui-monospace, monospace; }
</style>

<header>
  <h1>PicoGB</h1>
  <span id="status" class="dim">Not connected</span>
  <button id="connect">Connect</button>
</header>
<p id="nosupport" class="err" hidden>This browser has no Web Serial. Open this page in Chrome or Edge.</p>

<main>
  <div>
    <canvas id="screen" width="160" height="144"></canvas>
    <p id="stats" class="dim">&nbsp;</p>
    <p>
      <button id="quit" disabled>Quit to menu</button>
      <select id="tint" disabled title="Colours for original Game Boy games">
        <option hidden selected>Colours</option>
      </select>
    </p>
    <p class="dim">
      <kbd>WASD</kbd> or arrows: D-pad. <kbd>X</kbd>: A. <kbd>Z</kbd>: B.
      <kbd>Enter</kbd>: Start. <kbd>Backspace</kbd>: Select. <kbd>Ctrl+Shift+4</kbd>: quit the game.
    </p>
  </div>

  <section>
    <h2>Games <span id="free" class="dim"></span></h2>
    <table id="games"></table>
    <p id="empty" class="dim">Connect the Sprig to see its games.</p>

    <h2>Add games</h2>
    <label id="drop">Drop .gb or .gbc files here, or click to choose.
      <input id="file" type="file" accept=".gb,.gbc" multiple hidden>
    </label>
    <progress id="progress" hidden></progress>
    <p id="upload" class="dim"></p>
  </section>
</main>

<script>
"use strict";
// The packet format and all commands are described in firmware/PicoGB/link.h.
const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const TINTS = ["White", "Classic", "Blue", "Red", "Green", "Yellow", "Sunset", "Ice"];  // firmware order

const CRC16 = Uint16Array.from({ length: 256 }, (_, i) => {
  let c = i << 8;
  for (let k = 0; k < 8; k++) c = c & 0x8000 ? c << 1 ^ 0x1021 : c << 1;
  return c;
});
const CRC32 = Uint32Array.from({ length: 256 }, (_, i) => {
  let c = i;
  for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ c >>> 1 : c >>> 1;
  return c;
});
function crc16(bytes) {
  let c = 0xFFFF;
  for (const b of bytes) c = (c << 8 & 0xFFFF) ^ CRC16[c >> 8 ^ b];
  return c;
}
function crc32(bytes) {
  let c = ~0;
  for (const b of bytes) c = CRC32[(c ^ b) & 0xFF] ^ c >>> 8;
  return ~c >>> 0;
}
const u32 = v => new Uint8Array([v, v >> 8, v >> 16, v >>> 24]);
const rd32 = (p, o) => (p[o] | p[o + 1] << 8 | p[o + 2] << 16 | p[o + 3] << 24) >>> 0;
const kb = n => `${Math.round(n / 1024)} KB`;

function status(text, error = false) {
  $("status").textContent = text;
  $("status").className = error ? "err" : "dim";
}

// ---- link

let port = null, writer = null, rx = new Uint8Array(0);
const waiting = new Map();

function send(cmd, payload = new Uint8Array(0)) {
  const n = payload.length, pkt = new Uint8Array(8 + n);
  pkt.set([0x50, 0x47, 0x43, cmd.charCodeAt(0), n & 0xFF, n >> 8]);
  pkt.set(payload, 6);
  const crc = crc16(pkt.subarray(3, 6 + n));
  pkt[6 + n] = crc & 0xFF;
  pkt[7 + n] = crc >> 8;
  return writer.write(pkt);
}

// One request at a time, so two replies of the same type can't get mixed up.
let queue = Promise.resolve();
function request(cmd, payload, ms = 15000) {
  const run = () => new Promise((resolve, reject) => {
    const timer = setTimeout(() => { waiting.delete(cmd); reject(new Error("The Sprig did not reply")); }, ms);
    waiting.set(cmd, p => { clearTimeout(timer); resolve(p); });
    send(cmd, payload).catch(reject);
  });
  const result = queue.then(run, run);
  queue = result.catch(() => {});
  return result;
}

// Most replies start with a status byte. On an error, a message follows
// after `skip` more bytes.
function ok(p, skip = 0) {
  if (p[0] !== 0) throw new Error(dec.decode(p.subarray(1 + skip)) || "The Sprig reported an error");
  return p;
}

function receive(chunk) {
  let b = chunk;
  if (rx.length) { b = new Uint8Array(rx.length + chunk.length); b.set(rx); b.set(chunk, rx.length); }
  let i = 0;
  for (;;) {
    while (i + 3 <= b.length && !(b[i] === 0x50 && b[i + 1] === 0x47 && b[i + 2] === 0x52)) i++;
    if (b.length - i < 8) break;
    const n = b[i + 4] | b[i + 5] << 8;
    if (b.length - i < 8 + n) break;
    const body = b.subarray(i + 3, i + 6 + n);
    if (crc16(body) !== (b[i + 6 + n] | b[i + 7 + n] << 8)) { i++; continue; }
    const type = String.fromCharCode(body[0]), payload = body.subarray(3);
    if (type === "V") frame(payload);
    else { waiting.get(type)?.(payload); waiting.delete(type); }
    i += 8 + n;
  }
  rx = b.slice(i);
}

async function connect() {
  try {
    port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x2E8A }] });
    await port.open({ baudRate: 115200, bufferSize: 1 << 16 });
    await port.setSignals({ dataTerminalReady: true });
    writer = port.writable.getWriter();
  } catch (e) {
    try { await port?.close(); } catch {}
    port = null;
    if (e.name !== "NotFoundError") status(e.message, true);
    return;
  }
  status("Connected");
  $("connect").textContent = "Disconnect";
  $("tint").disabled = false;
  readLoop();
  refresh();
}

async function readLoop() {
  const reader = port.readable.getReader();
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      receive(value);
    }
  } catch (e) {
    status(`Connection lost: ${e.message}`, true);
  } finally {
    reader.releaseLock();
    disconnect();
  }
}

async function disconnect() {
  const p = port;
  port = null;
  try { writer?.releaseLock(); } catch {}
  writer = null;
  try { await p?.close(); } catch {}
  $("connect").textContent = "Connect";
  $("quit").disabled = $("tint").disabled = true;
  if ($("status").className !== "err") status("Not connected");
}

// ---- screen

const ctx = $("screen").getContext("2d");
const image = ctx.createImageData(160, 144);
const pixels = new Uint32Array(image.data.buffer);
let mode = "", frames = 0, emuMs = 0, statsAt = performance.now();

// RGB565 colours from the packet to canvas pixels (0xAABBGGRR).
function palette(p, n) {
  const out = new Uint32Array(n);
  for (let i = 0; i < n; i++) {
    const c = p[8 + 2 * i] | p[9 + 2 * i] << 8;
    out[i] = 0xFF000000 | (c & 31) * 255 / 31 << 16 | (c >> 5 & 63) * 255 / 63 << 8 | (c >> 11) * 255 / 31;
  }
  return out;
}

function frame(p) {
  const kind = p[0];
  if (kind === 2) {  // Color: half a frame, one palette index per pixel
    const pal = palette(p, 64), row0 = p[136], src = p.subarray(137);
    for (let i = 0, o = row0 * 160; i < src.length; i++) pixels[o + i] = pal[src[i] & 63];
    if (row0 === 0) frames++;
  } else if (kind === 0) {  // Game Boy: 2 bits per pixel
    const pal = palette(p, 16);
    for (let i = 0; i < 160 * 144; i++) pixels[i] = pal[p[40 + (i >> 2)] >> (i & 3) * 2 & 3];
    frames++;
  } else {  // the 160x128 menu at 4 bits per pixel, centred
    const pal = palette(p, 16);
    pixels.fill(0xFF000000);
    for (let i = 0; i < 160 * 128; i++) pixels[1280 + i] = pal[p[40 + (i >> 1)] >> (i & 1) * 4 & 15];
    frames++;
  }
  ctx.putImageData(image, 0, 0);
  emuMs = (p[2] | p[3] << 8) / 1000;

  const m = kind === 1 ? "menu" : "game";
  if (m !== mode) { mode = m; $("tint").selectedIndex = 0; refresh(); }
  const now = performance.now();
  if (now - statsAt >= 1000) {
    const fps = Math.round(frames * 1000 / (now - statsAt));
    $("stats").textContent = mode === "menu" ? "Menu"
      : `${kind === 2 ? "Color game" : "Game"}: ${emuMs.toFixed(1)} ms per frame of 16.7, ${fps} fps here`;
    frames = 0;
    statsAt = now;
  }
}

// ---- games

async function refresh() {
  if (!writer) return;
  try {
    const info = await request("I"), list = await request("L");
    const inGame = info[1] !== 0, running = inGame ? info[2] : -1;
    $("quit").disabled = !inGame;
    $("free").textContent = info[20] ? `(${(rd32(info, 21) / 1024).toFixed(1)} MB free on the SD card)`
                                     : `(${kb(rd32(info, 4))} free in flash)`;
    const rows = [];
    for (let o = 0; o + 87 <= list.length; o += 87) rows.push(gameRow(list.subarray(o, o + 87), running));
    $("games").replaceChildren(...rows);
    $("empty").hidden = rows.length > 0;
    $("empty").textContent = "No games yet.";
  } catch (e) {
    status(e.message, true);
  }
}

function gameRow(g, running) {
  const text = (a, b) => dec.decode(g.subarray(a, b)).replace(/\0.*$/s, "");
  const index = g[0], flags = g[5], name = text(6, 70);
  const notes = [flags & 1 && "save", flags & 2 && "in flash", flags & 4 && "not supported"].filter(Boolean);

  const tr = document.createElement("tr");
  tr.innerHTML = '<td></td><td class="dim"></td><td class="num"></td>' +
                 '<td class="num"><button>Play</button> <button>Delete</button></td>';
  const [cName, cNotes, cSize, cActions] = tr.cells;
  const [play, del] = cActions.querySelectorAll("button");
  if (index === running) tr.className = "playing";
  cName.textContent = name;
  cName.title = text(70, 87);
  cNotes.textContent = notes.join(", ");
  cSize.textContent = kb(rd32(g, 1));
  play.disabled = (flags & 4) !== 0;
  play.onclick = () => act(() => request("R", new Uint8Array([index])).then(ok));
  del.onclick = () => {
    if (confirm(`Delete ${name} from the Sprig?${flags & 1 ? " This also deletes its save." : ""}`))
      act(() => request("X", new Uint8Array([index])).then(ok));
  };
  return tr;
}

async function act(fn) {
  try { await fn(); } catch (e) { status(e.message, true); }
  await refresh();
}

// Upload: begin with the size and name, send 1 KB pieces, then finish with
// the CRC-32 of the whole file.
async function upload(files) {
  if (!writer) { status("Connect the Sprig first", true); return; }
  const bar = $("progress"), msg = $("upload");
  for (const f of files) {
    const data = new Uint8Array(await f.arrayBuffer()), t0 = performance.now();
    const name = enc.encode(f.name.replace(/\.[^.]*$/, "").slice(0, 39));
    bar.hidden = false;
    bar.max = data.length;
    bar.value = 0;
    msg.className = "dim";
    msg.textContent = `Sending ${f.name}…`;
    try {
      const begin = new Uint8Array(4 + name.length);
      begin.set(u32(data.length));
      begin.set(name, 4);
      ok(await request("U", begin));
      for (let off = 0; off < data.length; off += 1024) {
        const part = data.subarray(off, off + 1024), pkt = new Uint8Array(4 + part.length);
        pkt.set(u32(off));
        pkt.set(part, 4);
        ok(await request("D", pkt), 4);
        bar.value = off + part.length;
      }
      ok(await request("F", u32(crc32(data)), 30000), 1);
      msg.textContent = `Added ${f.name} (${kb(data.length)} in ${((performance.now() - t0) / 1000).toFixed(1)} s).`;
    } catch (e) {
      msg.className = "err";
      msg.textContent = `${f.name}: ${e.message}`;
    }
    await refresh();
  }
  bar.hidden = true;
}

const drop = $("drop");
$("file").onchange = e => { upload([...e.target.files]); e.target.value = ""; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); upload([...e.dataTransfer.files]); };

// ---- controls

// Keyboard to Game Boy buttons, bits as in gb.h.
const KEYS = {
  ArrowRight: 1, KeyD: 1, ArrowLeft: 2, KeyA: 2, ArrowUp: 4, KeyW: 4, ArrowDown: 8, KeyS: 8,
  KeyX: 16, KeyZ: 32, Backspace: 64, Enter: 128,
};
let held = 0;
function setHeld(mask) {
  if (mask === held) return;
  held = mask;
  if (writer) send("K", new Uint8Array([held])).catch(() => {});
}
addEventListener("keydown", e => {
  if (!writer) return;
  if (e.ctrlKey && e.shiftKey && e.code === "Digit4") {
    e.preventDefault();
    act(() => request("Q"));
  } else if (e.code in KEYS && !e.ctrlKey && !e.altKey && !e.metaKey) {
    e.preventDefault();
    setHeld(held | KEYS[e.code]);
  }
});
addEventListener("keyup", e => { if (e.code in KEYS) setHeld(held & ~KEYS[e.code]); });
addEventListener("blur", () => setHeld(0));

$("tint").append(...TINTS.map((t, i) => new Option(t, i)));
$("tint").onchange = e => { if (writer) send("P", new Uint8Array([+e.target.value])); };
$("quit").onclick = () => act(() => request("Q"));
$("connect").onclick = () => (port ? disconnect() : connect());
if (!("serial" in navigator)) {
  $("nosupport").hidden = false;
  $("connect").disabled = true;
}
</script>
